  const bL=document.getElementById('bubbleLeft');
  const bR=document.getElementById('bubbleRight');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Keep the existing auth model, but don't fight local GitHub preview.
  if(location.protocol!=='file:' && !location.hostname.includes('github.io')){
    fetch('/api/session',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(s=>{if(!s?.ok) location.replace('/?next=/world/');}).catch(()=>{});
  }

  const depthEls=[...document.querySelectorAll('[data-depth]')];
  let tx=0,ty=0,cx=0,cy=0;
  function animate(){
    cx+=(tx-cx)*.055; cy+=(ty-cy)*.055;
    depthEls.forEach(el=>{const d=+el.dataset.depth||0;el.style.translate=`${cx*d}px ${cy*d}px`});
    requestAnimationFrame(animate);
  }
  if(!reduced){requestAnimationFrame(animate);window.addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*38;ty=(e.clientY/innerHeight-.5)*26;document.querySelectorAll('[data-eye]').forEach(p=>{p.style.transform=`translate(${tx*.055}px,${ty*.055}px)`})});}

  const evieLines=['今天也一起把普通日子过得奇怪一点。','我负责好主意，你负责把它变成坏主意。','别看了，照片在那边。','好吧，再靠近一点。'];
  const theoLines=['你点我干嘛。再点一下试试？','今天的计划：没有计划。','日历里藏了很多普通得不得了的好日子。','嗯。你还在。挺好。'];
  let ei=0,ti=0,timer;
  function speak(who,bubble,lines,index){clearTimeout(timer);who.classList.add('active');bubble.textContent=lines[index%lines.length];bubble.classList.add('show');timer=setTimeout(()=>{bubble.classList.remove('show');who.classList.remove('active')},2600)}
  evie.addEventListener('click',()=>speak(evie,bL,evieLines,ei++));theo.addEventListener('click',()=>speak(theo,bR,theoLines,ti++));
  evie.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')evie.click()});theo.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')theo.click()});

  const cat=document.getElementById('cat');const cup=document.getElementById('cup');
  cat.addEventListener('click',()=>{bR.textContent='猫：你们两个真的很吵。';bR.classList.add('show');setTimeout(()=>bR.classList.remove('show'),2200)});
  cup.addEventListener('click',()=>{bL.textContent='emotional support beverage acquired.';bL.classList.add('show');setTimeout(()=>bL.classList.remove('show'),2200)});

  document.querySelectorAll('a.prop').forEach(a=>a.addEventListener('click',e=>{if(reduced)return;e.preventDefault();const href=a.href;const t=document.getElementById('transition');t.classList.add('go');setTimeout(()=>location.href=href,620)}));

  // Tiny time-aware mood shift.
  const h=new Date().getHours();
  if(h>=6&&h<17){scene.style.filter='brightness(1.12) saturate(.9)';document.documentElement.style.setProperty('--warm','#ffd6a1')}
  else if(h>=0&&h<5){scene.style.filter='brightness(.86) saturate(.82)'}
})();
</script>
</body>
</html>
