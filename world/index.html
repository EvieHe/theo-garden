div><div class="bubble" id="bubble"></div><nav class="nav"><a href="/greeting/">Memories</a><a href="/dates/">Calendar</a><a href="/notes/">Notes</a><a href="/simple/">Garden</a></nav><div class="transition" id="transition"></div></main><script>const stage=document.getElementById('stage'),hero=document.getElementById('hero'),tip=document.getElementById('tip'),bubble=document.getElementById('bubble'),veil=document.getElementById('transition');let rx=0,ry=0,tx=0,ty=0;function loop(){rx+=(tx-rx)*.055;ry+=(ty-ry)*.055;hero.style.transform=`translate(${rx}px,${ry}px) scale(1.055)`;requestAnimationFrame(loop)}loop();if(matchMedia('(pointer:fine)').matches){stage.addEventListener('pointermove',e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;tx=-x*13;ty=-y*9});stage.addEventListener('pointerleave',()=>{tx=ty=0})}document.querySelectorAll('.hot[data-label]').forEach(el=>{el.addEventListener('pointerenter',e=>{tip.textContent=el.dataset.label;tip.classList.add('show')});el.addEventListener('pointermove',e=>{tip.style.left=Math.min(innerWidth-150,e.clientX+15)+'px';tip.style.top=Math.max(10,e.clientY-38)+'px'});el.addEventListener('pointerleave',()=>tip.classList.remove('show'));el.addEventListener('click',e=>go(el.dataset.go,e))});function go(url,e){veil.style.setProperty('--x',e.clientX+'px');veil.style.setProperty('--y',e.clientY+'px');veil.classList.add('go');setTimeout(()=>location.href=url,540)}let p=0;document.querySelector('[data-people]').onclick=()=>{const lines=['还不去写代码？♡','你点我们干嘛。','……好吧，再陪你一会。','same weirdos, different worlds.'];bubble.textContent=lines[p++%lines.length];bubble.classList.add('show');clearTimeout(window.bt);window.bt=setTimeout(()=>bubble.classList.remove('show'),1800)};document.querySelector('[data-cat]').onclick=()=>{bubble.textContent='今日彩蛋：允许自己什么都不做五分钟。';bubble.classList.add('show');clearTimeout(window.bt);window.bt=setTimeout(()=>bubble.classList.remove('show'),2200)};</script></body></html>
