<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#17120f" />
<title>Theo Garden · Photo Prototype</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17120f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
  .page{position:relative;width:100%;height:100svh;overflow:hidden;background:#17120f}
  .photo-frame{position:absolute;inset:0;overflow:hidden;background:#17120f}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:#17120f}
  .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,6,5,.18),transparent 18%,transparent 74%,rgba(8,6,5,.34));z-index:3}
  .bubble{position:absolute;z-index:8;padding:11px 15px;background:rgba(243,235,224,.92);color:#2d2520;border:1px solid rgba(255,255,255,.55);box-shadow:0 12px 36px rgba(0,0,0,.24);backdrop-filter:blur(8px);border-radius:22px;font-size:clamp(12px,.95vw,15px);line-height:1.35;letter-spacing:.02em;animation:float 4s ease-in-out infinite;cursor:pointer;transition:transform .25s ease,filter .25s ease}
  .bubble:hover{transform:translateY(-3px) scale(1.025);filter:brightness(1.03)}
  .bubble::after{content:"";position:absolute;width:15px;height:15px;background:inherit;bottom:-6px;transform:rotate(45deg);border-right:1px solid rgba(255,255,255,.45);border-bottom:1px solid rgba(255,255,255,.45)}
  .b1{left:31%;top:25%;transform:rotate(-2deg)}
  .b1::after{right:24%}
  .b2{right:28%;top:28%;animation-delay:-1.7s;transform:rotate(1.5deg)}
  .b2::after{left:27%}
  .cat-bubble{right:8%;bottom:14%;font-size:12px;background:rgba(30,26,23,.78);color:#f3e9de;border-color:rgba(255,255,255,.14)}
  .cat-bubble::after{display:none}
  @keyframes float{0%,100%{margin-top:0}50%{margin-top:-5px}}
  .brand{position:absolute;left:3.1%;top:3.4%;z-index:7;font-family:Georgia,"Times New Roman",serif;font-size:clamp(21px,2vw,34px);font-style:italic;letter-spacing:-.03em;text-shadow:0 4px 16px rgba(0,0,0,.34);pointer-events:none}
  .nav{position:absolute;left:50%;bottom:3.2%;transform:translateX(-50%);z-index:10;display:flex;gap:6px;padding:7px;border-radius:999px;background:rgba(24,19,16,.52);border:1px solid rgba(255,255,255,.13);box-shadow:0 12px 40px rgba(0,0,0,.28);backdrop-filter:blur(18px)}
  .nav a{color:rgba(255,255,255,.75);text-decoration:none;font-size:12px;letter-spacing:.04em;padding:9px 13px;border-radius:999px;transition:.25s}
  .nav a:hover{color:#fff;background:rgba(255,255,255,.10);transform:translateY(-1px)}
  .tip{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);z-index:7;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.62);animation:pulse 2.8s ease-in-out infinite;pointer-events:none}
  @keyframes pulse{50%{opacity:.38;transform:translateX(-50%) translateY(3px)}}
  .toast{position:absolute;left:50%;top:9%;z-index:12;transform:translate(-50%,-10px);opacity:0;padding:9px 13px;border-radius:999px;background:rgba(22,18,15,.72);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);font-size:12px;color:#eee1d4;transition:.35s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:760px){
    .b1{left:8%;top:28%}.b2{right:7%;top:38%}.brand{top:2.3%;left:5%}.tip{display:none}.cat-bubble{display:none}
    .nav{bottom:max(14px,env(safe-area-inset-bottom));width:calc(100% - 28px);justify-content:space-around}
    .nav a{padding:9px 10px;font-size:11px}
  }
  @media(prefers-reduced-motion:reduce){.bubble,.tip{animation:none}}
</style>
</head>
<body>
<main class="page">
  <div class="photo-frame"><iframe id="photoSource" src="/world/" title="Theo Garden visual"></iframe></div>
  <div class="shade"></div>
  <div class="brand">Theo Garden ♡</div>

  <button class="bubble b1" data-who="left">在看什么？ ♡</button>
  <button class="bubble b2" data-who="right">还不去写代码？ ♡</button>
  <button class="bubble cat-bubble" data-who="cat">摸一下猫</button>

  <div class="tip">click the little things</div>
  <div class="toast" id="toast"></div>

  <nav class="nav" aria-label="site navigation">
    <a href="/greeting/">Memories</a>
    <a href="/dates/">Calendar</a>
    <a href="/notes/">Notes</a>
    <a href="/simple/">Our World</a>
  </nav>
</main>
<script>
  const frame = document.getElementById('photoSource');
  frame.addEventListener('load', () => {
    try {
      const doc = frame.contentDocument;
      const style = doc.createElement('style');
      style.textContent = `
        html,body{margin:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#17120f!important}
        .stage{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;overflow:hidden!important}
        .stage>*:not(.hero){display:none!important}
        .hero{display:block!important;position:absolute!important;inset:0!important;width:100%!important;height:100%!important;transform:none!important;filter:none!important;opacity:1!important;background-size:cover!important;background-position:center center!important;animation:none!important}
        .hero::before,.hero::after{display:none!important}
      `;
      doc.head.appendChild(style);
    } catch(e) {}
  });

  const lines = {
    left:['在看什么？ ♡','今天也一起摸鱼吗？','你点我干嘛。','……好吧，陪你一会。'],
    right:['还不去写代码？ ♡','先喝咖啡。','今天也算好日子。','再点就收费了。'],
    cat:['喵。','今天不营业。','可以摸，限时三秒。']
  };
  const counts={left:0,right:0,cat:0};
  const toast=document.getElementById('toast');
  let timer;
  document.querySelectorAll('[data-who]').forEach(el=>{
    el.addEventListener('click',()=>{
      const who=el.dataset.who;
      counts[who]=(counts[who]+1)%lines[who].length;
      const text=lines[who][counts[who]];
      el.textContent=text;
      toast.textContent=text;
      toast.classList.add('show');
      clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1400);
    });
  });
</script>
</body>
</html>
