<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17110e">
<title>Theo Garden — Quick Upload</title>
<style>
:root{--paper:#efe2d0;--ink:#2c211b;--night:#17110e;--muted:rgba(44,33,27,.58);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);min-height:100svh}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:18px 20px;background:rgba(239,226,208,.84);backdrop-filter:blur(18px);border-bottom:1px solid rgba(44,33,27,.1)}
header a{color:inherit;text-decoration:none;font-size:13px}.brand{font-family:Georgia,serif;font-size:18px}
main{width:min(860px,100%);margin:auto;padding:40px 20px 110px}.eyebrow{font-size:10px;letter-spacing:.22em;color:var(--muted)}
h1{font:400 clamp(42px,10vw,78px)/.96 Georgia,serif;margin:10px 0 16px}.lead{max-width:650px;line-height:1.72;color:var(--muted);font-size:14px}
.picker{margin-top:28px;border:1px dashed rgba(44,33,27,.28);border-radius:28px;padding:28px;background:rgba(255,255,255,.28)}
.picker input{position:absolute;opacity:0;pointer-events:none}.pick-btn,.upload-all{border:0;border-radius:999px;padding:14px 19px;background:var(--night);color:var(--paper);font-weight:700;font-size:14px}.pick-btn{display:inline-flex;align-items:center;gap:8px;cursor:pointer}.picker-note{font-size:12px;line-height:1.6;color:var(--muted);margin:14px 0 0}
.summary{display:flex;gap:16px;flex-wrap:wrap;margin:24px 0 8px}.chip{font-size:11px;border:1px solid rgba(44,33,27,.16);border-radius:999px;padding:7px 10px;background:rgba(255,255,255,.25)}
.days{display:grid;gap:16px;margin-top:24px}.day{border-top:1px solid rgba(44,33,27,.16);padding-top:18px}.day-head{display:flex;align-items:end;justify-content:space-between;gap:16px}.day-head h2{font:400 30px Georgia,serif;margin:0}.day-head small{color:var(--muted)}
.assets{display:grid;gap:10px;margin-top:12px}.asset{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:16px;background:rgba(255,255,255,.35)}.thumb{width:56px;height:56px;border-radius:12px;overflow:hidden;background:#d9c8b3;display:grid;place-items:center;font-size:10px;color:rgba(44,33,27,.45)}.thumb img{width:100%;height:100%;object-fit:cover}.meta strong{display:block;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta span{display:block;font-size:11px;color:var(--muted);margin-top:4px}.date-edit{border:0;background:transparent;font:inherit;font-size:11px;color:var(--muted);padding:4px 0}.live{display:inline-flex!important;width:max-content;padding:3px 6px;border-radius:999px;background:#2d211b;color:#f5e7d6;font-size:9px!important;letter-spacing:.08em}
.state{font-size:11px;color:var(--muted);max-width:110px;text-align:right}.state.ok{color:#48704f}.state.bad{color:#9a493e}
.bar{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:rgba(239,226,208,.9);backdrop-filter:blur(20px);border-top:1px solid rgba(44,33,27,.12);display:flex;align-items:center;justify-content:space-between;gap:16px}.bar p{margin:0;font-size:12px;color:var(--muted)}.upload-all:disabled{opacity:.42}
.empty{margin-top:48px;text-align:center;color:var(--muted);font:italic 18px Georgia,serif}
@media(max-width:620px){main{padding-top:26px}.picker{padding:22px}.asset{grid-template-columns:52px minmax(0,1fr)}.state{grid-column:2;text-align:left;max-width:none}.bar p{max-width:56%}}
</style>
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/lite.umd.js"></script>
</head>
<body>
<header><a href="./diary.html">← Diary</a><span class="brand">THEO GARDEN</span><span></span></header>
<main>
<p class="eyebrow">QUICK UPLOAD</p>
<h1>把相册倒进花园。</h1>
<p class="lead">可以一次多选。会优先读取照片自己的拍摄时间并自动按日期归档；Live Photo 如果浏览器拿到了静态图和配对 MOV，会作为一个完整实况保存。</p>
<section class="picker">
  <label class="pick-btn">＋ 选择照片 / 实况
    <input id="picker" type="file" multiple accept="image/*,video/quicktime,video/mp4,.heic,.heif,.mov">
  </label>
  <p class="picker-note">iPhone 提示：如果系统照片选择器只交给网页静态封面，页面会明确标成普通照片；要完整保留实况，可从“文件”里同时选择同名的 HEIC/JPG + MOV 原件。</p>
</section>
<div class="summary" id="summary"></div>
<section class="days" id="days"><p class="empty">还没有选择照片。</p></section>
</main>
<footer class="bar"><p id="overall">选择照片后会先在本机识别时间，不会立刻上传。</p><button class="upload-all" id="uploadAll" disabled>上传全部</button></footer>
<script type="module" src="./upload.js?v=20260926a"></script>
</body>
</html>
