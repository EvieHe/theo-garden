name: Assemble Theo Garden artwork

on:
  push:
    branches:
      - feat/living-garden-v2
    paths:
      - 'v2/assets/_import/manifest.txt'

permissions:
  contents: write

concurrency:
  group: theo-garden-artwork-import
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/living-garden-v2

      - name: Assemble artwork
        run: |
          set -euo pipefail
          if [ ! -f v2/assets/_import/manifest.txt ]; then
            echo "No import manifest; nothing to do."
            exit 0
          fi

          cat v2/assets/_import/hero-main.part*.b64 | base64 --decode > v2/assets/hero-main.webp
          cat v2/assets/_import/hero-secondary.part*.b64 | base64 --decode > v2/assets/hero-secondary.webp
          cat v2/assets/_import/hero-visual-reference.part*.b64 | base64 --decode > v2/assets/hero-visual-reference.webp

          test "$(wc -c < v2/assets/hero-main.webp)" -gt 200000
          test "$(wc -c < v2/assets/hero-secondary.webp)" -gt 200000
          test "$(wc -c < v2/assets/hero-visual-reference.webp)" -gt 200000

          rm -rf v2/assets/_import

      - name: Commit assembled artwork
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/assets
          if git diff --cached --quiet; then
            echo "Artwork already assembled."
            exit 0
          fi
          git commit -m "assets: add high-quality Theo Garden artwork"
          git push origin HEAD:feat/living-garden-v2
