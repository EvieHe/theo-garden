name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run check:worker

  preview:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Upload non-production preview version
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --preview-alias v2

      - name: Verify CloudBase bridge and bootstrap migration
        run: |
          set -euo pipefail
          BASE_URL="https://v2-theo-garden.jzk9cnnxn2.workers.dev"

          curl --fail --silent --show-error "$BASE_URL/api/health" -o /tmp/health.json
          jq -e '.configured.cloudbase == true' /tmp/health.json >/dev/null

          MIGRATE_STATUS="$(curl --silent --show-error -o /tmp/migrate.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/admin/bootstrap-cloudbase-migration-20260920")"
          cat /tmp/migrate.json
          test "$MIGRATE_STATUS" = "200"
          jq -e '.ok == true and .data.entries == 24 and .data.media == 19' /tmp/migrate.json >/dev/null

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Deploy Worker and static assets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://theo-garden.jzk9cnnxn2.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run production P0 smoke test
        run: npm run smoke
